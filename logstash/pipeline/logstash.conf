input {
  file {
    path => "/usr/share/logstash/data/server_logs.jsonl"
    start_position => "beginning"
    sincedb_path => "/tmp/.sincedb_server_logs"
    codec => "json"
    mode => "tail"
    stat_interval => "500ms" # Check for file updates every 500ms
    discover_interval => 15   # Look for new files every 15s
  }
}

filter {
  # Parse timestamp
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Severity and Category classification
  if [event_type] == "login_failed" {
    mutate {
      add_field => { "severity" => "medium" "threat_score" => 50 "event_category" => "authentication" }
    }
  } else if [event_type] == "login_success" {
    mutate {
      add_field => { "severity" => "info" "threat_score" => 5 "event_category" => "authentication" }
    }
  } else if [event_type] == "port_access" {
    if [status] == "failed" {
      mutate { add_field => { "severity" => "low" "threat_score" => 30 "event_category" => "network" } }
    } else {
      mutate { add_field => { "severity" => "info" "threat_score" => 10 "event_category" => "network" } }
    }
  } else if [event_type] == "web_request" {
    mutate { add_field => { "severity" => "info" "threat_score" => 15 "event_category" => "web" } }
  } else if [event_type] == "file_access" {
    mutate { add_field => { "severity" => "info" "threat_score" => 20 "event_category" => "file_system" } }
  }

  # Attack Detection
  if [request_payload] =~ /(?i)(OR\s+['"]?\d|DROP\s+TABLE|UNION\s+SELECT|--|admin['"]--|SELECT\s+\*\s+FROM|' OR '1'='1|' OR 'a'='a)/ {
    mutate {
      replace => { "severity" => "critical" "threat_score" => 95 }
      add_field => { "attack_type" => "sql_injection" }
      add_tag => ["attack", "sql_injection"]
    }
  }

  if [event_type] == "file_access" and [request_payload] =~ /(?i)(\/etc\/passwd|\/etc\/shadow|\.ssh\/id_rsa|bash_history|\.htpasswd)/ {
    mutate {
      replace => { "severity" => "high" "threat_score" => 85 }
      add_field => { "attack_type" => "sensitive_file_access" }
      add_tag => ["attack", "file_exfiltration"]
    }
  }

  # Type conversion
  mutate {
    convert => { "threat_score" => "integer" "port_number" => "integer" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "security-logs-data"
  }
}
